- defaults:
    link:
      create: true
      relink: true
      force: true

- link:
    ~/.ideavimrc:
      glob: false
      path: configs/JetBrains/.ideavimrc

    ~/.config/alacritty/alacritty.toml:
      glob: false
      path: configs/alacritty/alacritty.toml

    ~/.config/starship.toml:
      glob: false
      path: configs/alacritty/starship.toml

    ~/.config/dunst/dunstrc:
      glob: false
      path: configs/dunst/dunstrc

    ~/.config/nvim/:
      glob: true
      path: configs/nvim/*

    ~/.config/picom.conf:
      glob: false
      path: configs/picom/picom.conf

    ~/.config/rofi/:
      glob: true
      path: configs/rofi/*

    ~/.config/hypr/:
      glob: true
      path: configs/hypr/*

    ~/.config/polybar/:
      glob: true
      path: configs/polybar/*

    ~/.config/waybar/:
      glob: true
      path: configs/waybar/*

    ~/.zshrc:
      glob: false
      path: configs/zsh/.zshrc

    /etc/sddm.conf.d/default.conf:
      glob: false
      path: configs/sddm/default.conf

    /usr/share/sddm/scripts/Xsetup:
      glob: false
      path: configs/sddm/scripts/Xsetup

- clean: ['~']

- clean:
    ~/:
      force: true
    ~/.config:
      recursive: true
