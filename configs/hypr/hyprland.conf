# ===========================================
# ===== Persa's Hyprland config file ========
# ===========================================

# Monitor Settings
monitor=DP-1,preferred,3640x0,1
monitor=DP-2,preferred,1080x0,1
monitor=HDMI-A-1,preferred,0x0,1,transform,1
monitor=eDP-1,preferred,auto,1.5

env = XCURSOR_SIZE,12

input { 
    touchpad { 
        natural_scroll = true
        scroll_factor = 0.5
    } 
}

gestures {
  workspace_swipe = true
  workspace_swipe_fingers = 3
}

general {
    gaps_in = 2
    gaps_out = 6
    border_size = 2

    col.active_border = rgba(ff0088aa) rgba(0099adaa) 90deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

decoration {
    blur {
        enabled = true
        size = 1
        passes = 2
    }

    rounding = 8

    active_opacity = 1.0
    inactive_opacity = 0.75
    fullscreen_opacity = 1.0
    dim_special = 0.75
}

animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 5, default
    animation = borderangle, 1, 4, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 4, default, slidevert
}

misc {
    disable_hyprland_logo = true
    enable_swallow = true
    swallow_regex = ^(Alacritty)$
}

dwindle {
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

$mainMod = SUPER

# Main binds
bind = $mainMod, RETURN, exec, alacritty
bind = $mainMod, Q, killactive, 
bind = $mainMod SHIFT, E, exit, 
bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod SHIFT, L, exec, i3lock -t -i ~/Pictures/Wallpapers/bluescreen_dual.png
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp -d)" - | wl-copy #screenshot

bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, SPACE, togglefloating, 
bind = $mainMod, M, fullscreen, 1

# Volume and Media Control
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5 
bind = , XF86AudioLowerVolume, exec, pamixer -d 5 
bind = , XF86AudioMicMute, exec, pamixer --default-source -m
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Windows group
bind = $mainMod SHIFT, A, togglegroup,
bind = $mainMod CTRL, A, moveoutofgroup,
bind = $mainMod CTRL, left, moveintogroup, l
bind = $mainMod CTRL, right, moveintogroup, r
bind = $mainMod CTRL, up, moveintogroup, u
bind = $mainMod CTRL, down, moveintogroup, d
bind = $mainMod, S, changegroupactive, f
bind = $mainMod, A, changegroupactive, b

# Resize windows
bind = $mainMod CTRL SHIFT, right, resizeactive, 20 0
bind = $mainMod CTRL SHIFT, left, resizeactive, -20 0
bind = $mainMod CTRL SHIFT, up, resizeactive, 0 -20
bind = $mainMod CTRL SHIFT, down, resizeactive, 0 20

# Switch monitors
bind = $mainMod, TAB, workspace, 10
bind = $mainMod CTRL, TAB, workspace, 11
bind = $mainMod, 1, focusmonitor, HDMI-A-1
bind = $mainMod, 2, focusmonitor, DP-2
bind = $mainMod, 3, focusmonitor, DP-1
bind = $mainMod, Z, focusmonitor, DP-1
bind = $mainMod, Z, togglespecialworkspace, dashboard
bind = $mainMod, X, focusmonitor, DP-1
bind = $mainMod, X, togglespecialworkspace, messaging
bind = $mainMod, C, focusmonitor, DP-1
bind = $mainMod, C, togglespecialworkspace, work

# Move active window to a workspace
bind = $mainMod SHIFT, page_down, movetoworkspace, r+1
bind = $mainMod SHIFT, page_up, movetoworkspace, r-1
bind = $mainMod SHIFT, TAB, movetoworkspace, 10
bind = $mainMod CTRL SHIFT, TAB, movetoworkspace, 11
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Scroll through monitor workspaces
bind = $mainMod, page_down, workspace, r+1
bind = $mainMod, page_up, workspace, r-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Set workspaces to monitor
workspace = 10, monitor:DP-1
workspace = 11, monitor:DP-1
workspace = special:dashboard, monitor:DP-1
workspace = special:messaging, monitor:DP-1
workspace = special:work, monitor:DP-1
workspace = 1, monitor:HDMI-A-1, monitor:eDP-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:DP-2
workspace = 6, monitor:DP-2
workspace = 7, monitor:DP-2
workspace = 8, monitor:DP-2
workspace = 9, monitor:DP-2

# Window rules
windowrule = tile,^(clion)$
windowrule = opacity 1.0 override 1.0 override, title:^(Picture in Picture)$
windowrule = opacity 1.0 override 1.0 override, title:^(dash_htop)$
windowrule = opacity 1.0 override 1.0 override, ^(.*discord).*$
windowrule = workspace special:dashboard, ^(.*Spotify).*$

# Window rules for sharing screen
windowrulev2 = opacity 0.0 override 0.0 override,class:^(xwaylandvideobridge)$
windowrulev2 = noanim,class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus,class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1,class:^(xwaylandvideobridge)$
windowrulev2 = noblur,class:^(xwaylandvideobridge)$
windowrulev2 = stayfocused, class:(Rofi)$
windowrulev2 = nofocus, title:^(dash_htop)$
windowrulev2 = workspace special:messaging silent, title:^(.*Discord).*$
windowrulev2 = workspace special:work silent, title:^(.*Microsoft Teams).*$
windowrulev2 = workspace special:work silent, title:^(.*Slack).*$
windowrulev2=suppressevent activate,xwayland:1

# Exec at start
exec-once = hyprpaper
exec-once = wayland
exec-once = waybar
exec-once = vesktop
exec-once = slack
exec-once = teams
exec-once = [workspace special:dashboard silent;float;size 1300 750;move 310 50] spotify
exec-once = [workspace special:dashboard silent;float;size 1300 200;move 310 830] alacritty --title dash_htop -e 'htop'
