# ===========================================
# ===== Persa's Hyprland config file ========
# ===========================================

# Monitor Settings
monitor=eDP-1,1920x1200@120,0x0,1
monitor=HDMI-A-1,880x1440,4480x0,1
monitor=DP-2,preferred,0x0,1
monitor=DP-1,2560x1440,1920x0,1
#monitor=DP-1,3440x1440,1920x0,1

env = XCURSOR_SIZE,8

input { 
    kb_layout = us
    kb_variant = intl
    
    touchpad { 
        natural_scroll = true
        scroll_factor = 0.5
    } 
}

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 0

    col.active_border = rgba(fe2a50aa) rgba(0099adaa) 90deg
    col.inactive_border = rgba(595959aa)

    layout = scrolling
}

scrolling {
  column_width = 0.75
  focus_fit_method = 0
  explicit_column_widths = 0.25, 0.333, 0.5, 0.75, 1.0
}

decoration {
    blur {
        enabled = true
        size = 4
        passes = 2
    }

    rounding = 8

    active_opacity = 1.0
    inactive_opacity = 0.9
    fullscreen_opacity = 1.0
    dim_special = 0.0

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(1a1a1aaf)
        offset = 0 5
        ignore_window = false
    }
}

animations {
    enabled = yes

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 5, default
    animation = borderangle, 1, 4, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 4, default, slidevert
}

misc {
    disable_hyprland_logo = true
    enable_swallow = true
    swallow_regex = ^(Alacritty)$
}

dwindle {
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

$mainMod = SUPER

gesture = 3, horizontal, workspace
gesture = 3, up, fullscreen

# Main binds
bind = $mainMod, RETURN, exec, kitty zellij
bind = $mainMod, Q, killactive, 
bind = $mainMod SHIFT, E, exit, 
bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod, TAB, exec, rofi -show window
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp -d)" - | wl-copy #screenshot

bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, SPACE, togglefloating, 
bind = $mainMod CTRL, SPACE, fullscreen, 1

bind = $mainMod SHIFT, SPACE, exec, ~/.config/hypr/scripts/toggle_layout.sh

# Volume and Media Control
bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5 
bind = , XF86AudioLowerVolume, exec, pamixer -d 5 
bind = , XF86AudioMicMute, exec, pamixer --default-source -m
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Brightness Control
bind = ,XF86MonBrightnessDown, exec, brightnessctl set 10%-
bind = ,XF86MonBrightnessUp, exec, brightnessctl set 10%+

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, comma, layoutmsg, move -col
bind = $mainMod, period, layoutmsg, move +col

# Move windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, period, layoutmsg, swapcol r
bind = $mainMod SHIFT, comma, layoutmsg, swapcol l

bind = $mainMod, P, layoutmsg, promote

# Windows group
bind = $mainMod SHIFT, A, togglegroup,
bind = $mainMod CTRL, A, moveoutofgroup,
bind = $mainMod CTRL, left, moveintogroup, l
bind = $mainMod CTRL, right, moveintogroup, r
bind = $mainMod CTRL, w, moveintogroup, u
bind = $mainMod CTRL, d, moveintogroup, d
bind = $mainMod, S, changegroupactive, f
bind = $mainMod, A, changegroupactive, b

# Resize windows
bind = $mainMod CTRL SHIFT, right, resizeactive, 20 0
bind = $mainMod CTRL SHIFT, left, resizeactive, -20 0
bind = $mainMod CTRL SHIFT, up, resizeactive, 0 -20
bind = $mainMod CTRL SHIFT, down, resizeactive, 0 20
bind = $mainMod CTRL SHIFT, comma, layoutmsg, colresize -conf
bind = $mainMod CTRL SHIFT, period, layoutmsg, colresize +conf

bind = $mainMod CTRL, comma, layoutmsg, fit all
bind = $mainMod CTRL, period, layoutmsg, fit active

# Switch monitors
bind = $mainMod, 1, focusmonitor, DP-2
bind = $mainMod, 2, focusmonitor, DP-1
bind = $mainMod, 3, focusmonitor, HDMI-A-1
bind = $mainMod, Z, togglespecialworkspace, dashboard
bind = $mainMod, X, togglespecialworkspace, messaging
bind = $mainMod, C, focusmonitor, DP-2
bind = $mainMod, C, togglespecialworkspace, work

# Move active window to a workspace
bind = $mainMod SHIFT, page_down, movetoworkspace, r+1
bind = $mainMod SHIFT, page_up, movetoworkspace, r-1

# Scroll through monitor workspaces
bind = $mainMod, page_down, workspace, r+1
bind = $mainMod, page_up, workspace, r-1
bind = , swipe:3:l, workspace, r+1
bind = , swipe:3:r, workspace, r-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Set workspaces to monitor
workspace = special:dashboard
workspace = special:messaging
workspace = special:work

# Window rules
windowrule {
  name = windowrule-1
  tile = on
  match:class = ^(clion)$
}

windowrule {
  name = windowrule-2
  opacity = 1.0 override 1.0 override
  match:title = ^(Picture in Picture)$
}

windowrule {
  name = windowrule-2
  opacity = 1.0 override 1.0 override
  match:title = ^(Picture-in-Picture)$
}

windowrule {
  name = windowrule-4
  opacity = 1.0 override 1.0 override
  match:title = ^(.*okpi-main).*$
}

windowrule {
  name = windowrule-5
  opacity = 1.0 override 1.0 override
  match:class = ^(.*discord).*$
}

windowrule {
  name = windowrule-6
  opacity = 1.0 override 1.0 override
  match:class = ^(.*vesktop).*$
}

windowrule {
  name = windowrule-7
  opacity = 0.0 override 0.0 override
  no_anim = on
  no_initial_focus = on
  max_size = 1 1
  no_blur = on
  match:class = ^(xwaylandvideobridge)$
}

windowrule {
  name = windowrule-8
  stay_focused = on
  match:class = (Rofi)$
}


# Workspace assignments with new v2 syntax
windowrule {
  name = windowrule-9
  workspace = special:dashboard silent
  match:class = ^(spotify)$
}

windowrule {
  name = windowrule-10
  workspace = special:messaging silent
  match:class = ^(discord)$
}

windowrule {
  name = windowrule-11
  workspace = special:messaging silent
  match:class = ^(vesktop)$
}

windowrule {
  name = windowrule-12
  workspace = special:work silent
  match:class = ^(teams-for-linux)$
}

windowrule {
  name = windowrule-13
  workspace = special:work silent
  match:class = ^(slack)$
}

# Exec at start
exec-once = hyprpaper
exec-once = wayland
exec-once = waybar
exec-once = vesktop --ozone-platform=wayland
exec-once = teams-for-linux
exec-once = spotify --ozone-platform=wayland
# exec-once = [workspace special:dashboard silent;float;size 1300 200;move 310 830] alacritty --title dash_htop -e 'htop'
